# EnchantLevelUnlimited - Remove enchantment level limits in anvils

settings:
  # XP cost strategy when combine would exceed the "Too Expensive" threshold (cost >= 40)
  # clamp     = always set cost to 39 (max allowed below "Too Expensive"), works on all versions
  # raise-cap = raise the "Too Expensive" cap to Integer.MAX_VALUE (requires 1.13+; clamps on 1.8-1.12)
  cost-strategy: clamp

  # Reset prior-work penalty to 0 on combined results (prevents exponential cost escalation)
  reset-penalty: true

  # Allow mutually-exclusive enchantments to coexist on the same item
  allow-damage-conflicts: false       # Sharpness + Smite + Bane of Arthropods
  allow-protection-conflicts: false   # all 4 protection types together
  allow-bow-conflicts: false          # Infinity + Mending
  allow-boots-conflicts: false        # Depth Strider + Frost Walker
  allow-crossbow-conflicts: false     # Multishot + Piercing

  # Allow enchants on tools they're not normally compatible with (e.g., Silk Touch on a sword)
  # false = respect vanilla tool-enchant compatibility (incompatible sacrifice enchants are skipped)
  # true  = allow incompatible tool-enchant combinations
  allow-incompatible-tool: false

# Enchantment max levels (vanilla keys, lowercase)
# Enchants NOT listed here default to their vanilla getMaxLevel()
# Values listed here OVERRIDE vanilla max - set higher to allow unlimited combining
# NOTE: Hard cap is 255 — Minecraft/Paper won't store enchant levels above this
enchants:
